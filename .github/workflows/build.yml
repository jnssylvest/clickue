name: Build

# Builds Clickue.exe, the portable zip and the installer on Windows.
# - every push / pull request: tests, security checks, build + smoke test; files available
#   under "Artifacts"
# - every push to main: publishes (or updates) the GitHub Release for the version in
#   src/clickue.py, e.g. VERSION = "4.5" -> release "v4.5" with the downloads attached.
#   Bump VERSION to make a new release.
#
# Security: the build job can only read the repository. Only the separate release job (which
# runs for pushes to main, never for pull requests) may write releases and post the
# announcement. Third-party actions are pinned to exact commits (the comment shows the
# version). No secrets are used besides the automatic GITHUB_TOKEN.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (code compiles, all modules import, logo renders)
        run: |
          python -m py_compile src/clickue.py
          python -c "import sys, importlib.util; sys.argv=['clickue']; s=importlib.util.spec_from_file_location('c','src/clickue.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.HAVE_CV and m.HAVE_TRAY and m.HAVE_PIL and m.HAVE_DPAPI, 'missing packages'; m.make_logo(64); m.parse_combo('Ctrl+S'); print('Clickue', m.VERSION, 'OK')"

      - name: Headless tests
        run: |
          python tests/test_watchers.py
          python tests/test_features.py
          python tests/test_click_spot.py
          python tests/test_workflows.py
          python tests/check_release.py

      - name: Security checks (dependency audit, static analysis)
        run: |
          python -m pip install pip-audit bandit
          python -m pip_audit -r requirements.txt
          python -m bandit -q -r src --severity-level high --confidence-level medium

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/clickue.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build Clickue.exe
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name Clickue --icon assets/clickue.ico --hidden-import pystray._win32 src/clickue.py

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/Clickue.exe, installer/portable.txt, README.md, LICENSE pkg/
          Copy-Item installer/before-install.txt pkg/READ-ME-FIRST.txt
          Compress-Archive -Path pkg/* -DestinationPath "dist/Clickue-Portable-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $env:CLICKUE_VERSION = "${{ steps.ver.outputs.version }}"
          & $iscc installer/clickue.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/Clickue-Setup-*.exe, dist/Clickue-Portable-*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Clickue-${{ steps.ver.outputs.version }}
          path: |
            dist/Clickue-Setup-*.exe
            dist/Clickue-Portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Clickue-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Clickue ${{ needs.build.outputs.version }}
          body: |
            > ⚠️ **Clickue is vibe-coded and was developed with substantial AI assistance.** Caution was taken during development, but AI-assisted development does not guarantee bug-free or secure software. Review the source and use normal precautions. Test automations safely, protect notification credentials, and avoid unattended use for consequential actions.

            **Downloads**
            - **Clickue-Setup-${{ needs.build.outputs.version }}.exe**: installer (only for you, or all users)
            - **Clickue-Portable-${{ needs.build.outputs.version }}.zip**: unzip and run, no install
            - **SHA256SUMS.txt**: checksums to verify the downloads

            Windows 10/11, 64-bit. Windows may show "Windows protected your PC" for a new unsigned app: click **More info → Run anyway** only if you downloaded it from this page.
            Please read the [warnings](https://github.com/${{ github.repository }}#%EF%B8%8F-responsible-use--warnings) and [security notes](https://github.com/${{ github.repository }}/blob/main/SECURITY.md) before use. What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            💡 Ideas? [Suggest a feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.yml) or chat in [Discussions](https://github.com/${{ github.repository }}/discussions). 🐞 [Report a bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.yml).
          files: |
            dist/Clickue-Setup-*.exe
            dist/Clickue-Portable-*.zip
            dist/SHA256SUMS.txt
          make_latest: true
          discussion_category_name: Announcements
