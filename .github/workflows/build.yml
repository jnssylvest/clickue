name: Build

# Builds Clickue.exe, the portable zip and the installer on Windows.
# - every push / pull request: build + smoke test, files available under "Artifacts"
# - every push to main: publishes (or updates) the GitHub Release for the version in
#   src/clickue.py, e.g. VERSION = "4.1" -> release "v4.1" with the downloads attached.
#   Bump VERSION to make a new release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (code compiles, all modules import, logo renders)
        run: |
          python -m py_compile src/clickue.py
          python -c "import sys, importlib.util; sys.argv=['clickue']; s=importlib.util.spec_from_file_location('c','src/clickue.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert m.HAVE_CV and m.HAVE_TRAY and m.HAVE_PIL, 'missing packages'; m.make_logo(64); m.parse_combo('Ctrl+S'); print('Clickue', m.VERSION, 'OK')"

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/clickue.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build Clickue.exe
        run: python -m PyInstaller --noconfirm --onefile --noconsole --name Clickue --icon assets/clickue.ico --hidden-import pystray._win32 src/clickue.py

      - name: Make portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/Clickue.exe, installer/portable.txt, README.md, LICENSE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "dist/Clickue-Portable-${{ steps.ver.outputs.version }}.zip" -Force

      - name: Make installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $env:CLICKUE_VERSION = "${{ steps.ver.outputs.version }}"
          & $iscc installer/clickue.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Clickue-${{ steps.ver.outputs.version }}
          path: |
            dist/Clickue-Setup-*.exe
            dist/Clickue-Portable-*.zip

      - name: Publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Clickue ${{ steps.ver.outputs.version }}
          body: |
            **Downloads**
            - **Clickue-Setup-${{ steps.ver.outputs.version }}.exe**: installer (only for you, or all users)
            - **Clickue-Portable-${{ steps.ver.outputs.version }}.zip**: unzip and run, no install

            Windows 10/11, 64-bit. Windows may show "Windows protected your PC" for a new unsigned app: click **More info → Run anyway**.
            Please read the [warnings](https://github.com/${{ github.repository }}#%EF%B8%8F-responsible-use--warnings) before use. What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            💡 Ideas? [Suggest a feature](https://github.com/${{ github.repository }}/issues/new?template=feature_request.yml) or chat in [Discussions](https://github.com/${{ github.repository }}/discussions). 🐞 [Report a bug](https://github.com/${{ github.repository }}/issues/new?template=bug_report.yml).
          files: |
            dist/Clickue-Setup-*.exe
            dist/Clickue-Portable-*.zip
          make_latest: true
          discussion_category_name: Announcements
