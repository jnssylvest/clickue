name: 🐞 Bug report
description: Something didn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a watcher that…
        2. …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clickue version
      description: ☰ Menu → About
      placeholder: "4.2"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How do you run Clickue?
      options:
        - Installer
        - Portable zip
        - From source
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and display scaling
      placeholder: Windows 11, 125 %, connected via Remote Desktop
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: ☰ Menu → Open log file. Copy the relevant lines and **remove anything private** (names, paths, webhook URLs, tokens).
      render: text
